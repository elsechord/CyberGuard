{% if completed_jobs %}
<section class="card" aria-label="最近完成的调查">
  <div class="section-head"><h2>最近完成的调查</h2><a href="/investigations">查看全部调查</a></div>
  <div class="table-wrap"><table><thead><tr><th>任务</th><th>完成时间</th></tr></thead><tbody>
  {% for job in completed_jobs %}<tr><td><a href="/investigations/{{ job.id }}">{{ job.title }}</a></td><td>{{ job.updated_at|ts }}</td></tr>{% endfor %}
  </tbody></table></div>
</section>
{% endif %}

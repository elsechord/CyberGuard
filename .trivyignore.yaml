# Trivy targeted ignore list — CyberGuard
# Every entry carries a justification and an expiry date; review at expiry.
summary: |
  Integration-only local build images that mirror upstream AgentTeams base
  images, which run as root. These images are used exclusively in the
  loopback AgentTeams integration environment and are never deployed to
  production. Service images built by this repository remain non-root and
  fully covered by the scan.

misconfigurations:
  - id: DS-0002
    path: deploy/agentteams-local/controller.Dockerfile
    expired_at: 2027-03-31
    statement: >-
      Final stage inherits the pinned upstream AgentTeams embedded controller
      image (agentteams-embedded:v1.2.2), which runs as root. Adding a USER
      directive would deviate from the upstream runtime behavior this local
      integration build intentionally mirrors (see docs/AGENTTEAMS_LOCAL.md).
      Loopback-only, not production. Revisit when upstream ships a non-root
      controller image.
  - id: DS-0002
    path: deploy/agentteams-local/qwenpaw.Dockerfile
    expired_at: 2027-03-31
    statement: >-
      Final stage inherits the pinned upstream QwenPaw worker image, which
      runs as root and installs Skills at runtime as part of its managed
      lifecycle; forcing a non-root USER would break the mirrored upstream
      behavior (see docs/AGENTTEAMS_LOCAL.md and
      deploy/agentteams-local/QWENPAW_READINESS.md). Loopback-only
      integration environment, not production. Revisit when upstream ships
      non-root worker images.
